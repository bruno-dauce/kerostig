name: Scrape calls for papers
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Scraper unique a lancer (ex: sage, emerald)'
        required: false
  schedule:
    - cron: '10 2 * * *'
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repository
        # Action epinglee au SHA du tag v4 : un tag git est mutable, un SHA
        # non. Si le depot actions/checkout etait compromis et le tag v4
        # redeplace, ce job continuerait a executer le code verifie.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # --ignore-scripts neutralise les hooks preinstall/postinstall des
      # dependances, vecteur principal des compromissions de la chaine npm
      # (type Shai-Hulud). Aucun des paquets de l'arbre n'a de script
      # d'installation, et les scrapers utilisent le Chrome preinstalle du
      # runner (channel: "chrome" dans scrapers/browser.mjs) plutot qu'un
      # navigateur telecharge par Playwright : rien ne depend de ces hooks.
      # A revoir si une future dependance en exige un.
      - run: npm ci --ignore-scripts
      # curl standard sous Linux expose un fingerprint TLS (OpenSSL)
      # detecte et bloque par Cloudflare sur certains editeurs (SAGE,
      # Wiley) alors que la meme requete passe en local sous Windows
      # (Schannel). curl-impersonate rejoue le ClientHello d'un vrai
      # navigateur. Le depot original (lwthiker/curl-impersonate, v0.6.1,
      # mars 2024) ne suffit plus : son fingerprint Chrome116 se fait aussi
      # bloquer (403 constate en pratique sur le hub SAGE malgre son
      # installation). On utilise donc le fork actif lexiforest/curl-
      # impersonate (https://github.com/lexiforest/curl-impersonate), dont
      # la derniere release (v2.1.0) ajoute une cible Chrome150 plus
      # recente. best-effort : si l'installation echoue (URL de release
      # changee, etc.), les scrapers retombent sur curl standard (cf
      # scrapers/curlClient.mjs) -- on ne bloque pas tout le run pour ca.
      - name: Install curl-impersonate
        continue-on-error: true
        run: |
          set -e
          VERSION=v2.1.0
          ASSET="curl-impersonate-${VERSION}.x86_64-linux-gnu.tar.gz"
          URL="https://github.com/lexiforest/curl-impersonate/releases/download/${VERSION}/${ASSET}"
          # Condense releve via l'API GitHub (champ digest de l'asset, calcule
          # cote serveur a l'upload) le 2026-08-20. Le job a les droits
          # contents:write : on ne fait pas tourner un binaire non verifie
          # dans un runner qui peut pousser sur le depot. Si l'archive change
          # (release rejouee, depot amont compromis), la verification echoue,
          # le PATH n'est pas modifie et les scrapers retombent sur curl
          # standard via continue-on-error -- degrade, jamais compromis.
          SHA256=f75fc543ba0e5a64765b18041e382ddd2f961cd7491e5642e67438551a01af2f

          echo "Telechargement de ${URL}"
          curl -sSL -o /tmp/curl-impersonate.tar.gz "$URL"

          echo "${SHA256}  /tmp/curl-impersonate.tar.gz" | sha256sum -c -

          mkdir -p /tmp/curl-impersonate
          tar -xzf /tmp/curl-impersonate.tar.gz -C /tmp/curl-impersonate

          BIN_PATH=$(find /tmp/curl-impersonate -name 'curl_chrome150' -print -quit)
          if [ -z "$BIN_PATH" ]; then
            echo "curl_chrome150 introuvable dans l'archive extraite -- structure du tarball :" >&2
            find /tmp/curl-impersonate >&2
            exit 1
          fi

          BIN_DIR=$(dirname "$BIN_PATH")
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "curl-impersonate installe dans $BIN_DIR"

          sudo apt-get update
          sudo apt-get install -y libnss3 nss-plugin-pem ca-certificates
      - name: Verify curl-impersonate installation
        run: |
          if command -v curl_chrome150 >/dev/null 2>&1; then
            echo "curl_chrome150 disponible : $(command -v curl_chrome150)"
            curl_chrome150 --version || true
          else
            echo "curl_chrome150 non disponible -- les scrapers curl utiliseront le repli curl standard"
          fi
      - name: Scrape
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: xvfb-run node ./scrapers/scraper.mjs ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - run: npm run rss --if-present
      - name: Commit and push if it changed
        run: |-
          git config user.name "Calls for Papers Scraper"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "[SCRAPER]: ${timestamp}" || exit 0
          git push