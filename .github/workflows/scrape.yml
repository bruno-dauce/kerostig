name: Scrape calls for papers
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Scraper unique a lancer (ex: sage, emerald)'
        required: false
  schedule:
    - cron: '10 2 * * *'
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this repository
        # Action epinglee au SHA du tag v4 : un tag git est mutable, un SHA
        # non. Si le depot actions/checkout etait compromis et le tag v4
        # redeplace, ce job continuerait a executer le code verifie.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # --ignore-scripts neutralise les hooks preinstall/postinstall des
      # dependances, vecteur principal des compromissions de la chaine npm
      # (type Shai-Hulud). Aucun des paquets de l'arbre n'a de script
      # d'installation, et les scrapers utilisent le Chrome preinstalle du
      # runner (channel: "chrome" dans scrapers/browser.mjs) plutot qu'un
      # navigateur telecharge par Playwright : rien ne depend de ces hooks.
      # A revoir si une future dependance en exige un.
      - run: npm ci --ignore-scripts
      # curl standard sous Linux expose un fingerprint TLS (OpenSSL)
      # detecte et bloque par Cloudflare sur certains editeurs (SAGE,
      # Wiley) alors que la meme requete passe en local sous Windows
      # (Schannel). curl-impersonate rejoue le ClientHello d'un vrai
      # navigateur. Le depot original (lwthiker/curl-impersonate, v0.6.1,
      # mars 2024) ne suffit plus : son fingerprint Chrome116 se fait aussi
      # bloquer (403 constate en pratique sur le hub SAGE malgre son
      # installation). On utilise donc le fork actif lexiforest/curl-
      # impersonate (https://github.com/lexiforest/curl-impersonate), dont
      # la derniere release (v2.1.0) ajoute une cible Chrome150 plus
      # recente. best-effort : si l'installation echoue (URL de release
      # changee, etc.), les scrapers retombent sur curl standard (cf
      # scrapers/curlClient.mjs) -- on ne bloque pas tout le run pour ca.
      - name: Install curl-impersonate
        continue-on-error: true
        run: |
          set -e
          VERSION=v2.1.0
          ASSET="curl-impersonate-${VERSION}.x86_64-linux-gnu.tar.gz"
          URL="https://github.com/lexiforest/curl-impersonate/releases/download/${VERSION}/${ASSET}"
          # Condense releve via l'API GitHub (champ digest de l'asset, calcule
          # cote serveur a l'upload) le 2026-08-20. Le job a les droits
          # contents:write : on ne fait pas tourner un binaire non verifie
          # dans un runner qui peut pousser sur le depot. Si l'archive change
          # (release rejouee, depot amont compromis), la verification echoue,
          # le PATH n'est pas modifie et les scrapers retombent sur curl
          # standard via continue-on-error -- degrade, jamais compromis.
          SHA256=f75fc543ba0e5a64765b18041e382ddd2f961cd7491e5642e67438551a01af2f

          echo "Telechargement de ${URL}"
          curl -sSL -o /tmp/curl-impersonate.tar.gz "$URL"

          echo "${SHA256}  /tmp/curl-impersonate.tar.gz" | sha256sum -c -

          mkdir -p /tmp/curl-impersonate
          tar -xzf /tmp/curl-impersonate.tar.gz -C /tmp/curl-impersonate

          BIN_PATH=$(find /tmp/curl-impersonate -name 'curl_chrome150' -print -quit)
          if [ -z "$BIN_PATH" ]; then
            echo "curl_chrome150 introuvable dans l'archive extraite -- structure du tarball :" >&2
            find /tmp/curl-impersonate >&2
            exit 1
          fi

          BIN_DIR=$(dirname "$BIN_PATH")
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          echo "curl-impersonate installe dans $BIN_DIR"

          sudo apt-get update
          sudo apt-get install -y libnss3 nss-plugin-pem ca-certificates
      - name: Verify curl-impersonate installation
        run: |
          if command -v curl_chrome150 >/dev/null 2>&1; then
            echo "curl_chrome150 disponible : $(command -v curl_chrome150)"
            curl_chrome150 --version || true
          else
            echo "curl_chrome150 non disponible -- les scrapers curl utiliseront le repli curl standard"
          fi
      # Le profil Chrome persistant (scrapers/browser.mjs) porte les cookies
      # cf_clearance obtenus en resolvant un challenge Cloudflare. En local
      # ils durent un an et Emerald se charge en moins d'une seconde ; en CI
      # le profil etait recree a chaque run, donc chaque passage se
      # presentait a Cloudflare comme un visiteur jamais vu, depuis une IP
      # de datacenter -- la pire combinaison, et le challenge d'Emerald
      # restait insoluble (constate le 2026-08-24 : 0 appel sur 209).
      #
      # On ne met en cache que ce qui porte l'identite (jar de cookies et
      # etat reseau, ~400 Ko), pas le profil entier : il pese 444 Mo en
      # local, dont des caches de rendu et de shaders qui n'ont aucun
      # interet ici. "Local State" est volontairement absent : il ne
      # contient la cle de chiffrement des cookies que sous Windows et
      # macOS, pas sous Linux (cf --password-store=basic dans browser.mjs).
      #
      # Reserve : cf_clearance est lie par Cloudflare au couple IP + User-
      # Agent. L'IP des runners GitHub changeant d'un run a l'autre, le
      # cookie restaure a de bonnes chances d'etre refuse. Les deux etapes
      # d'inspection ci-dessous servent a trancher sur pieces plutot qu'a
      # supposer. Si le cookie ne survit pas, ce cache est a retirer et il
      # faut passer a une sortie reseau hors datacenter.
      - name: Restore browser profile
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .browser-profile/userdir/Default/Network
            .browser-profile/userdir/Default/Preferences
          key: browser-profile-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            browser-profile-${{ runner.os }}-
      - name: Inspect restored profile
        continue-on-error: true
        # Invoque via bash plutot qu'en executable : le depot est edite sous
        # Windows, ou le bit d'execution ne survit pas toujours au commit.
        run: bash ./.github/scripts/inspect-browser-profile.sh "avant le scraping"
      - name: Scrape
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: xvfb-run node ./scrapers/scraper.mjs ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Inspect profile after scraping
        if: always()
        continue-on-error: true
        # Invoque via bash plutot qu'en executable : le depot est edite sous
        # Windows, ou le bit d'execution ne survit pas toujours au commit.
        run: bash ./.github/scripts/inspect-browser-profile.sh "apres le scraping"
      # if: always() -- un run qui sort en erreur (scraper en alerte) a tout
      # de meme pu obtenir un cf_clearance exploitable au passage suivant.
      # La cle porte le run_id : chaque passage ecrit sa propre entree, et
      # restore-keys rend la plus recente. Pas de mise a jour en place, une
      # entree de cache etant immuable une fois ecrite.
      - name: Save browser profile
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .browser-profile/userdir/Default/Network
            .browser-profile/userdir/Default/Preferences
          key: browser-profile-${{ runner.os }}-${{ github.run_id }}
      # Les deux etapes suivantes tournent meme si le scraping a echoue. Un
      # passage peut sortir en erreur (trop de scrapers en alerte, ou plantage
      # avant la collecte) tout en ayant produit des donnees valides, deja
      # passees par le modele : les jeter ferait repayer l'extraction au
      # passage suivant. Le job reste rouge, seul le resultat est conserve.
      - run: npm run rss --if-present
        if: always()
      - name: Commit and push if it changed
        if: always()
        run: |-
          git config user.name "Calls for Papers Scraper"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "[SCRAPER]: ${timestamp}" || exit 0
          git push